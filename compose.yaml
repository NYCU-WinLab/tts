name: ${COMPOSE_PROJECT_NAME:-tts}

# The web app: pages, the OpenAI-style /v1 API, MCP and the job queue. The
# GPU worker runs elsewhere (worker/compose.yaml) and only calls in.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tts
      POSTGRES_USER: tts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tts", "-d", "tts"]
      interval: 5s
      retries: 20

  # One-shot: applies drizzle/*.sql, then web starts.
  migrate:
    image: ghcr.io/nycu-winlab/tts:${TTS_VERSION:-main}
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_URL: postgres://tts:${POSTGRES_PASSWORD}@postgres:5432/tts
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/nycu-winlab/tts:${TTS_VERSION:-main}
    restart: unless-stopped
    init: true
    # Next waits for open event streams on SIGTERM; cut them short.
    stop_grace_period: 3s
    env_file: .env
    environment:
      DATABASE_URL: postgres://tts:${POSTGRES_PASSWORD}@postgres:5432/tts
    ports:
      - ${TTS_BIND:-127.0.0.1}:${TTS_PORT:-3000}:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/.well-known/oauth-protected-resource').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 10s
      retries: 10
      start_period: 60s
      start_interval: 1s

volumes:
  postgres:
